name: Auto commit

on:
  # GitHub silently drops scheduled runs when the Actions queue is busy, and
  # drops them hardest on the hour and half-hour. So: over-schedule on an odd
  # minute and let the once-per-day guard below decide which attempt counts.
  schedule:
    - cron: "17 13,15,17,19,21,23 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autocommit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if today is already done
        id: guard
        run: |
          today=$(date -u '+%Y-%m-%d')
          last=$(cut -c1-10 LAST_UPDATED 2>/dev/null || true)
          if [ "$last" = "$today" ]; then
            echo "Already committed for $today - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing yet for $today - proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name  "Shawn Li"
          git config user.email "lishawn81@gmail.com"

          msgs=("chore(bot): commit" "chore(bot): bump timestamp" "chore(bot): sync")

          # Per-repo daily share. Six repos x 3..6 => 18..36 commits/day.
          # Change the 4 and the 3 to retune: n = (RANDOM % spread) + floor.
          n=$(( (RANDOM % 4) + 3 ))
          echo "Making $n commits."

          for _ in $(seq 1 "$n"); do
            # Nanoseconds, so each iteration is a real content change even when
            # several land inside the same second.
            date -u '+%Y-%m-%dT%H:%M:%S.%NZ' > LAST_UPDATED
            git add -A
            git commit -m "${msgs[$((RANDOM % ${#msgs[@]}))]}"
          done

      - name: Push
        if: steps.guard.outputs.run == 'true'
        run: git push origin HEAD:main
